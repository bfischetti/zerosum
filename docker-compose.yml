services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: zerosum
      POSTGRES_PASSWORD: zerosum
      POSTGRES_DB: zerosum
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerosum -d zerosum"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
